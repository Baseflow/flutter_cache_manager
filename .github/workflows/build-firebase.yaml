name: build firebase

on:
  workflow_dispatch:

  push:
    tags:
      - "firebase-v[0-9]+.[0-9]+.[0-9]+*"
    branches: [develop, main]
    paths:
      - "flutter_cache_manager_firebase/**"
      - ".github/workflows/build-firebase.yaml"
  pull_request:
    branches: [develop, main]
    paths:
      - "flutter_cache_manager_firebase/**"
      - ".github/workflows/build-firebase.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  quality:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./flutter_cache_manager_firebase

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Download dependencies
        run: flutter pub get

      - name: Run Dart Format
        run: dart format --set-exit-if-changed .

      - name: Run Flutter Analyzer
        run: flutter analyze

      - name: Run unit tests
        run: flutter test --coverage

  publish_cache_manager_firebase:
    if: ${{ github.ref_type == 'tag' }}
    name: Publish Cache Manager Firebase
    permissions:
      id-token: write
      contents: read
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./flutter_cache_manager_firebase

    steps:
      - uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Publish package
        run: dart pub publish -v -f
